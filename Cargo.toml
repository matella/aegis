[workspace]
resolver = "2"
members = ["crates/aegis-core", "crates/aegis-client", "crates/aegis-uploader"]
# crates ajoutées au fur et à mesure du plan : aegis-app

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
