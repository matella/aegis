[package]
name = "aegis-app"
version = "0.1.0"
edition = "2021"
description = "Aegis — native operator console for Jarvis and its satellites"
authors = ["Matthieu Hella"]
license = "MIT"
repository = "https://github.com/matella/aegis"

[[bin]]
name = "aegis"
path = "src/main.rs"

[dependencies]
aegis-core = { path = "../aegis-core" }
aegis-client = { path = "../aegis-client" }
aegis-uploader = { path = "../aegis-uploader" }
eframe = { version = "0.31", features = ["persistence"] }
egui = "0.31"
# Chargement d'images distantes (pochette now-playing) : loader URL + décodage JPEG/PNG.
egui_extras = { version = "0.31", features = ["image", "http"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tokio = { version = "1", features = ["full"] }
tray-icon = "0.19"
open = "5"
serde_json.workspace = true
raw-window-handle = "0.6"
tokio-tungstenite = "0.24"
futures-util = "0.3"
cpal = "0.15"
rodio = "0.19"
base64 = "0.22"

# Pilotage fenêtre bas-niveau (show/hide tray fiable) — Windows uniquement.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"] }
winreg = "0.52" # démarrage auto (HKCU\…\Run)

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1" # embarque l'icône .ico dans l'exe
